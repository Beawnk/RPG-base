<text x="102" y="98" fill="#4e3a28" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" letter-spacing="3" xml:space="preserve" filter="url(#typed)">ARQUIVO GERAL · OCORRÊNCIAS</text>
<text x="102" y="132" fill="#241810" font-family="Courier New, Courier, monospace" font-size="24" font-weight="700" letter-spacing="2" xml:space="preserve" filter="url(#typed)">RELATÓRIO DE OCORRÊNCIA</text>
<text x="102" y="156" fill="#4e3a28" font-family="Courier New, Courier, monospace" font-size="12.5"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">Nº 0000-EX · documento de exemplo</text>
<line x1="102" y1="172" x2="738" y2="172" stroke="#241810" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="102" y="210" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">LOCAL......: escola estadual desativada, zona rural</text>
<text x="102" y="236" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">DATA.......:   /  /19  </text>
