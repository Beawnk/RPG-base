<text x="102" y="262" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">EQUIPE.....:           ,            </text>
<rect x="218.0" y="249" width="92.0" height="17" fill="#120c08" filter="url(#ink)"/>
<rect x="326.0" y="249" width="101.0" height="17" fill="#120c08" filter="url(#ink)"/>
<text x="102" y="288" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">CLASSIFIC..: RESTRITO</text>
<text x="102" y="336" fill="#241810" font-family="Courier New, Courier, monospace" font-size="14" font-weight="700" letter-spacing="2" xml:space="preserve" filter="url(#typed)">RESUMO DA OCORRÊNCIA</text>
<text x="102" y="368" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">Equipe chegou ao local às 22h40. O zelador relatou luzes</text>
<text x="102" y="392" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">acesas no ginásio, sem energia desde o fechamento. No</text>
<text x="102" y="416" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">vestiário masculino foram encontrados                    </text>
<rect x="443.0" y="403" width="173.0" height="17" fill="#120c08" filter="url(#ink)"/>
<text x="102" y="440" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">                       . Contenção concluída às 03h15,</text>
<rect x="101.0" y="427" width="209.0" height="17" fill="#120c08" filter="url(#ink)"/>
<text x="102" y="464" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">sem baixas na equipe. Testemunha encaminhada para         </text>
<rect x="551.0" y="451" width="74.0" height="17" fill="#120c08" filter="url(#ink)"/>
<text x="102" y="488" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">               .</text>
<rect x="101.0" y="475" width="137.0" height="17" fill="#120c08" filter="url(#ink)"/>
<text x="102" y="530" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">Em depoimento, o zelador afirma que viu alguém no corredor</text>
<text x="102" y="554" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">do ginásio nas três noites anteriores, sempre parado, sempre</text>
<text x="102" y="578" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">de costas, sempre no mesmo lugar perto do bebedouro. Disse</text>
<text x="102" y="602" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">que reconheceria o rosto, mas que nunca chegou perto o</text>
<text x="102" y="626" fill="#241810" font-family="Courier New, Courier, monospace" font-size="15"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">bastante. Recusou-se a voltar ao prédio.</text>
