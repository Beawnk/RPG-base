<text x="378" y="732" fill="#4e3a28" font-family="Courier New, Courier, monospace" font-size="14"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">pintado na parede do</text>
<text x="378" y="756" fill="#4e3a28" font-family="Courier New, Courier, monospace" font-size="14"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">vestiário, a 1,80 m do</text>
<text x="378" y="780" fill="#4e3a28" font-family="Courier New, Courier, monospace" font-size="14"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">chão. Tinta ainda úmida.</text>
<text x="378" y="804" fill="#4e3a28" font-family="Courier New, Courier, monospace" font-size="14"  letter-spacing="0" xml:space="preserve" filter="url(#typed)"></text>
<text x="378" y="828" fill="#4e3a28" font-family="Courier New, Courier, monospace" font-size="14"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">Não traduzido. Ver</text>
<text x="378" y="852" fill="#4e3a28" font-family="Courier New, Courier, monospace" font-size="14"  letter-spacing="0" xml:space="preserve" filter="url(#typed)">protocolo de leitura.</text>
