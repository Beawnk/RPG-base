<polygon points="50,40 790,40 790,880 772,910 780,940 750,962 756,994 720,1010 708,1044 670,1052 650,1078 612,1090 50,1090" fill="#000" filter="url(#shadow)"/>
<g filter="url(#uvtint)">
<g clip-path="url(#sheet)">
